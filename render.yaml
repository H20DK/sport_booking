services:
  - type: web
    name: sport-booking-api
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: sport-booking-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sport-booking.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sport-booking.vercel.app
      - key: DATABASE_URL
        sync: false
